# Lokal k3d cluster'ındaki "prod" ortamı (kalamar-prod namespace'i). Argo CD bu dosyayı kullanır.
# Dev'den farkı: her main build'i değil, yalnızca sürüm tag'leri (vX.Y.Z) buraya gelir.
# image.tag'i promote workflow'u (.github/workflows/promote.yml) tag push'unda günceller; elle değiştirmeyin.
# İçerik, dev'de test edilmiş image'ın aynısıdır: yeniden build edilmez, mevcut image'a sürüm etiketi eklenir.

image:
  tag: "0.6.0"
ingress:
  host: kalamar-prod.localhost
sqlserver:
  # deploy/scripts/seal-sqlserver-secret.ps1 -Environment prod bu alanı doldurur (dev'den ayrı bir şifre).
  sealedSaPassword: ""
  storage:
    size: 2Gi
