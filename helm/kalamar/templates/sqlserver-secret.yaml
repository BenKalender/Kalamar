{{- /*
SA şifresi düz metin olarak hiçbir zaman render edilmez:
- existingSecret verilmişse hiçbir şey üretilmez, o Secret kullanılır.
- sealedSaPassword verilmişse bir SealedSecret üretilir (sealed-secrets controller gerekir).
- İkisi de yoksa kalamar.sqlserver.validate anlaşılır bir hata verir.
*/}}
{{- if or .Values.sqlserver.enabled .Values.apps.persistence.sqlPassword }}
{{- include "kalamar.sqlserver.validate" . }}
{{- if and (not .Values.sqlserver.existingSecret) .Values.sqlserver.sealedSaPassword }}
{{- $name := include "kalamar.sqlserver.secretName" . }}
{{- $ctx := dict "root" . "component" "sqlserver" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kalamar.labels" $ctx | nindent 4 }}
  annotations:
    # Secret, veritabanından (wave -1) önce hazır olmalı.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    MSSQL_SA_PASSWORD: {{ .Values.sqlserver.sealedSaPassword | quote }}
  template:
    metadata:
      name: {{ $name }}
      labels:
        {{- include "kalamar.labels" $ctx | nindent 8 }}
    type: Opaque
{{- end }}
{{- end }}
