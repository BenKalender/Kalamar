{{- if .Values.ingress.enabled }}
{{- $ctx := dict "root" . "component" "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kalamar.fullname" . }}
  labels:
    {{- include "kalamar.labels" $ctx | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* /api istekleri doğrudan gateway'e gider; yol değiştirilmez (rewrite yok). */}}
          {{- if .Values.apps.gateway.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "kalamar.componentName" (dict "root" . "component" "gateway") }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.apps.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kalamar.componentName" (dict "root" . "component" "frontend") }}
                port:
                  name: http
          {{- end }}
{{- end }}
