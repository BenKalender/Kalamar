# argo-cd Helm chart'ı (argo/argo-cd 10.18.3, Argo CD v3.6.2) için lokal cluster değerleri.
# bootstrap.ps1 kurar:
#   helm upgrade --install argocd argo/argo-cd --version 10.18.3 -n argocd --create-namespace -f deploy/argocd/argocd-values.yaml

global:
  domain: argocd.localhost

configs:
  params:
    # TLS'i ingress tarafında da yapmıyoruz; UI düz HTTP ile http://argocd.localhost:8000 adresinde.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
  resources:
    requests: { cpu: 25m, memory: 64Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 32Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }

# Lokal kurulumda SSO ve bildirim gerekmiyor; giriş admin kullanıcısıyla yapılır.
dex:
  enabled: false
notifications:
  enabled: false
