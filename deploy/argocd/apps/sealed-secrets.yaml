# Sealed Secrets controller'ı: Git'teki SealedSecret'ları cluster'da çözüp Secret'a çevirir.
# Şifreleme anahtarı yalnızca bu cluster'da durur (yedeği: bootstrap.ps1 -> %USERPROFILE%\.kalamar\).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Uygulamalardan (wave 0) önce kurulur; SealedSecret CRD'si onlardan önce hazır olur.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      valuesObject:
        # kubeseal varsayılan olarak kube-system/sealed-secrets-controller'ı arar; bu ad sayesinde
        # kubeseal'a --controller-name vermek gerekmez.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
